name: live

# Run the tests that call NOAA and NDBC, to notice when their formats change.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check and test against NOAA and NDBC
        run: ./scripts/test -m live
        env:
          # Fail instead of updating uv.lock when it does not match pyproject.toml.
          UV_LOCKED: '1'
