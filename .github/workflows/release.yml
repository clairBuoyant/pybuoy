name: release

# Publish to PyPI when a version tag is pushed. Uses PyPI Trusted Publishing,
# which must be configured for this repository, workflow and environment at
# https://pypi.org/manage/project/pybuoy/settings/publishing/
#
# Then ask Read the Docs to look for the new tag, so its "stable" docs follow
# the release. This needs a Read the Docs API token in the RTD_TOKEN secret of
# the pypi environment (https://app.readthedocs.org/accounts/tokens/).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Check and test
        run: ./scripts/test
        env:
          # Fail instead of updating uv.lock when it does not match pyproject.toml.
          UV_LOCKED: '1'
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish

  docs:
    # Read the Docs hears about a tag from GitHub, but skips a version sync
    # requested within 60 seconds of the previous one, such as the one for the
    # branch deleted by the merge (trigger_sync_versions in its
    # readthedocs/core/views/hooks.py). It then never learns about the tag, and
    # "stable" keeps serving the previous release. Ask again once the 60 seconds
    # have passed: either this sync runs, or a later one already saw the tag.
    # It answers 202 either way, so this job passing does not show that
    # "stable" moved.
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {}
    steps:
      - name: Ask Read the Docs to sync versions
        run: |
          sleep 60
          curl --fail-with-body --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Token $RTD_TOKEN" \
            https://app.readthedocs.org/api/v3/projects/pybuoy/sync-versions/
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
