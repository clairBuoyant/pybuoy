name: release

# Publish to PyPI when a version tag is pushed. Uses PyPI Trusted Publishing,
# which must be configured for this repository, workflow and environment at
# https://pypi.org/manage/project/pybuoy/settings/publishing/
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check the tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Test
        run: |
          uv sync --locked --no-group docs
          uv run pytest
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
