[project]
name = "pybuoy"
version = "0.6.1"
description = "Python wrapper for NOAA and NDBC REST web services."
authors = [{ name = "Kyle J. Burda", email = "kylejbdev@gmail.com" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "GPL-3.0-or-later"
keywords = ["NDBC", "NOAA", "api", "buoy", "weather", "wrapper"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = ["requests>=2.33.1,<3"]

[project.urls]
Documentation = "https://pybuoy.readthedocs.io"
Changelog = "https://pybuoy.readthedocs.io/en/latest/package_info/changelog.html"
"Source Code" = "https://github.com/clairBuoyant/pybuoy"
"Bug Tracker" = "https://github.com/clairBuoyant/pybuoy/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "mypy>=2.3.1,<3",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.1.1,<10",
    "types-requests>=2.33.0,<3",
]
docs = ["furo>=2025.12.19", "Sphinx>=9.1.0,<10"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pybuoy", "tests", "CHANGES.rst"]

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E", "F", "I", "PT", "RUF", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"docs/examples/*" = ["T20"]

[tool.mypy]
files = ["pybuoy", "tests", "docs/examples"]
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: calls NOAA/NDBC over the network (run with `pytest -m live`)"]
