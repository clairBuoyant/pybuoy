[project]
name = "pybuoy"
version = "0.5.11"
description = "Python wrapper for NOAA and NDBC REST web services."
authors = [{ name = "Kyle J. Burda", email = "kylejbdev@gmail.com" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "GPL-3.0-or-later"
keywords = ["NDBC", "NOAA", "api", "buoy", "weather", "wrapper"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.33.1,<3"]
documentation = "https://pybuoy.readthedocs.io"
include = ["LICENSE"]

[project.urls]
"Source Code" = "https://github.com/clairBuoyant/pybuoy"
"Bug Tracker" = "https://github.com/clairBuoyant/pybuoy/issues"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "mypy>=2.3.1,<3",
    "pre-commit>=4.6.0,<5",
    "pytest>=9.1.1,<10",
    "types-requests>=2.33.0,<3",
]
docs = ["furo>=2025.12.19", "Sphinx>=9.1.0,<10"]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
    ".git",
    ".github",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "dist",
    "htmlcov",
]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.mypy]
packages = ["pybuoy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: calls NOAA/NDBC over the network (run with `pytest -m live`)"]
