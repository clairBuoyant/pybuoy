repos:
  - repo: https://github.com/clairBuoyant/pre-commit
    rev: v0.2.0
    hooks:
      - id: branch-validate
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [ commit-msg ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
      - id: remove-tabs
  # Run the linters from the locked dev environment so hooks, scripts and CI
  # all use the versions in uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [ python, pyi ]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [ python ]
        pass_filenames: false
